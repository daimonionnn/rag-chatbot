# Overrides the model hardcoded in the upstream compose file
# (RAG/deploy/local/podman-compose.yml sets INFERENCE_MODEL: llama3.2:3b-instruct-fp16),
# so the upstream file itself stays untouched.
#
# Usage — from RAG/deploy/local:
#   podman-compose -f podman-compose.yml -f ../../../compose-model-override.yml \
#       up -d llamastack rag-ui
services:
  llamastack:
    environment:
      INFERENCE_MODEL: "gemma3:27b-it-fp16"
      # Activates the TrustyAI RAGAS eval provider, which is gated on this var
      # (`${env.EMBEDDING_MODEL:+trustyai_ragas_inline}`) and uses it as the
      # embedding model for the similarity-based metrics.
      EMBEDDING_MODEL: "ollama/qwen3-embedding:4b-fp16"
      # Backs the builtin::websearch toolgroup (Agent-based mode). Interpolated
      # from the shell, so the key itself lives in the untracked .env.local that
      # start-stack.sh sources — never in a committed file. Empty is tolerated:
      # the toolgroup then 401s, which only affects web search.
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
  rag-ui:
    # Raises the "Max Tokens" sampling-parameter slider's ceiling (and fixes it
    # actually being reachable), and stops every sidebar change from wiping the
    # chat history — see patch-max-tokens-slider.py. Applied at container start,
    # not baked into the image, so it survives an upstream image rebuild and
    # never touches the RAG/ clone itself.
    # Absolute path: podman-compose resolves a relative source here against
    # the BASE compose file's directory (RAG/deploy/local), not this file's
    # own directory — a relative path silently mounted an auto-created empty
    # directory there instead of erroring (see BUGS.md).
    volumes:
      - /home/matt/development/rag-chatbot/patch-max-tokens-slider.py:/tmp/patch-max-tokens-slider.py:ro
    entrypoint:
      - sh
      - -c
      - >-
        python /tmp/patch-max-tokens-slider.py &&
        exec python -m streamlit run
        /app/llama_stack_ui/distribution/ui/app.py
        --server.port=8501 --server.address=0.0.0.0
