version: 2
distro_name: starter
# Trimmed 0.6.0 run config for a RAG chatbot backed by host Ollama.
# Derived from the stock `starter` distribution config, keeping only the
# providers the frontend (llama-stack 0.6.0) actually uses: ollama inference,
# sentence-transformers embeddings, faiss vector_io, localfs files + pypdf
# processing, meta-reference agents (OpenAI responses/conversations), llama-guard
# safety and the rag/websearch tool runtime, plus the out-of-tree TrustyAI RAGAS
# eval provider (+ datasetio/benchmarks it needs). Dropped: the many remote
# inference backends and the scoring/post_training/batches training stack.
apis:
- agents
- benchmarks
- datasetio
- eval
- file_processors
- files
- inference
- safety
- tool_runtime
- vector_io
providers:
  inference:
  - provider_id: ollama
    provider_type: remote::ollama
    config:
      # Append /v1 so the compose-provided OLLAMA_URL (e.g. http://172.17.0.1:11434,
      # no /v1) still hits Ollama's OpenAI-compatible endpoint.
      base_url: ${env.OLLAMA_URL:=http://localhost:11434}/v1
  # Same LLM, but reached through the NeMo Guardrails proxy so input/output
  # rails apply. Registered alongside the direct `ollama` provider so the UI's
  # model picker doubles as a guardrails on/off switch. Uses remote::vllm
  # because NeMo exposes a plain OpenAI-compatible API (this mirrors upstream,
  # where the only guardrails change was swapping this provider's URL).
  - provider_id: nemo
    provider_type: remote::vllm
    config:
      # 0.6.0's remote::vllm adapter expects `base_url` (upstream's backup
      # run-config still used the older `url:` key, which is silently ignored
      # and makes the provider fail with "You must provide a URL").
      base_url: ${env.NEMO_URL:=http://nemo-guardrails:9000}/v1
      api_token: fake
      max_tokens: 4096
  - provider_id: sentence-transformers
    provider_type: inline::sentence-transformers
  vector_io:
  - provider_id: faiss
    provider_type: inline::faiss
    config:
      persistence:
        namespace: vector_io::faiss
        backend: kv_default
  files:
  - provider_id: meta-reference-files
    provider_type: inline::localfs
    config:
      storage_dir: ${env.FILES_STORAGE_DIR:=~/.llama/distributions/starter/files}
      metadata_store:
        table_name: files_metadata
        backend: sql_default
  file_processors:
  - provider_id: pypdf
    provider_type: inline::pypdf
  safety:
  - provider_id: llama-guard
    provider_type: inline::llama-guard
    config:
      excluded_categories: []
  agents:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      persistence:
        agent_state:
          namespace: agents
          backend: kv_default
        responses:
          table_name: responses
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
  tool_runtime:
  - provider_id: tavily-search
    provider_type: remote::tavily-search
    config:
      api_key: ${env.TAVILY_SEARCH_API_KEY:=}
      max_results: 3
  # Alternative web-search backend. Registered alongside Tavily because the
  # `builtin::websearch` toolgroup below binds to exactly one provider, and both
  # register their tool under the same name (`web_search`), so which one backs
  # the toolgroup is a one-line switch and nothing above the provider layer
  # notices. Keyless by default, like Tavily — see SETUP.md for supplying a key.
  - provider_id: brave-search
    provider_type: remote::brave-search
    config:
      api_key: ${env.BRAVE_SEARCH_API_KEY:=}
      max_results: 3
  - provider_id: rag-runtime
    provider_type: inline::rag-runtime
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
  # RAGAS evaluation as an out-of-tree provider (TrustyAI). Enabled only when
  # EMBEDDING_MODEL is set, mirroring the provider's own sample distribution.
  # `module:` is how llama-stack loads an external provider from a pip package.
  eval:
  - provider_id: ${env.EMBEDDING_MODEL:+trustyai_ragas_inline}
    provider_type: inline::trustyai_ragas
    module: llama_stack_provider_ragas.inline
    config:
      embedding_model: ${env.EMBEDDING_MODEL}
      ragas_config:
        # Default is true, which makes ONE unparseable judge reply abort the
        # whole evaluation: a 182-row job died after 54 minutes because the
        # judge emitted truncated JSON on a single row. With this off, that row
        # scores NaN and the run continues.
        raise_exceptions: false
      kvstore:
        namespace: ragas
        backend: kv_default
  # Local JSON/CSV eval datasets. The provider's sample distro also wires the
  # remote::huggingface datasetio; omitted here since our eval data is local.
  datasetio:
  - provider_id: localfs
    provider_type: inline::localfs
    config:
      kvstore:
        namespace: datasetio::localfs
        backend: kv_default
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.llama/distributions/starter}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.llama/distributions/starter}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      namespace: prompts
      backend: kv_default
    connectors:
      namespace: connectors
      backend: kv_default
registered_resources:
  models:
  - model_id: ${env.INFERENCE_MODEL:=gemma3:27b-it-fp16}
    provider_id: ollama
    model_type: llm
  # Guardrailed variant of the same model. Shows up as
  # `nemo/<model>` next to `ollama/<model>` in the UI's model picker.
  - model_id: ${env.INFERENCE_MODEL:=gemma3:27b-it-fp16}
    provider_id: nemo
    provider_model_id: ${env.INFERENCE_MODEL:=gemma3:27b-it-fp16}
    model_type: llm
  # Matches the original PoC's embedding (presentation: "Qwen3-4B, dim=2560").
  # Strongly multilingual, unlike all-MiniLM-L6-v2 which is English-centric and
  # weak on Slovak. Served by Ollama, so it needs no extra in-process deps.
  - model_id: qwen3-embedding:4b-fp16
    provider_id: ollama
    provider_model_id: qwen3-embedding:4b-fp16
    model_type: embedding
    metadata:
      embedding_dimension: 2560
  # Kept registered so the older 384-dim FantaCo vector stores stay usable.
  - model_id: all-MiniLM-L6-v2
    provider_id: sentence-transformers
    provider_model_id: sentence-transformers/all-MiniLM-L6-v2
    model_type: embedding
    metadata:
      embedding_dimension: 384
  shields: []
  vector_dbs: []
  datasets: []
  scoring_fns: []
  benchmarks: []
  tool_groups:
  # Switched from upstream's `tavily-search` because the key we have is a Brave
  # one. Without a usable key this toolgroup is not merely inert: the provider
  # raises 401 and the agent answers from parametric memory instead (see BUGS.md
  # B3), so the backing provider has to match whichever key is actually set.
  - toolgroup_id: builtin::websearch
    provider_id: brave-search
  - toolgroup_id: builtin::rag
    provider_id: rag-runtime
server:
  port: 8321
vector_stores:
  default_provider_id: faiss
  default_embedding_model:
    provider_id: ollama
    model_id: qwen3-embedding:4b-fp16
  # Chunking matched to the original PoC: 512 tokens, overlap 64.
  file_ingestion_params:
    default_chunk_size_tokens: 512
    default_chunk_overlap_tokens: 64
  chunk_retrieval_params:
    chunk_multiplier: 5
    max_tokens_in_context: 4000
    default_reranker_strategy: rrf
    rrf_impact_factor: 60.0
    weighted_search_alpha: 0.5
connectors: []
